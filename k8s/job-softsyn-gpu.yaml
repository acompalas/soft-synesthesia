apiVersion: batch/v1
kind: Job
metadata:
  name: anderson-softsyn-gpu
  namespace: erl-ucsd-supp
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400        # hard stop after 4 h
  template:
    spec:
      restartPolicy: Never
      tolerations:
      - key: "nautilus.io/reservation"
        operator: "Equal"
        value: "erl-ucsd"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090", "NVIDIA-GeForce-RTX-4090", "NVIDIA-A10", "NVIDIA-A40", "NVIDIA-L40", "NVIDIA-L40S", "NVIDIA-RTX-A5000", "NVIDIA-RTX-A6000", "NVIDIA-L4", "NVIDIA-A100-PCIE-40GB", "NVIDIA-A100-80GB-PCIe", "NVIDIA-A100-SXM4-80GB", "Tesla-V100-SXM2-32GB", "NVIDIA-TITAN-RTX", "Quadro-RTX-6000", "Quadro-RTX-8000"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["nrp-01.laccd.edu", "ry-gpu-02.sdsc.optiputer.net"]
      containers:
      - name: main
        image: nvcr.io/nvidia/cuda:11.8.0-cudnn8-devel-ubuntu20.04
        command: ["bash", "-c", "sleep 14400"]   # manual use: exec in and run commands yourself
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: 24Gi
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: 24Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: data
          mountPath: /data
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: data
        persistentVolumeClaim:
          claimName: anderson-softsyn-data
