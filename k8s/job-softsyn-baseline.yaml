apiVersion: batch/v1
kind: Job
metadata:
  name: anderson-softsyn-baseline
  namespace: erl-ucsd-supp
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 259200        # hard stop after 72 h (resume from the last checkpoint if needed)
  template:
    spec:
      restartPolicy: Never
      tolerations:
      - key: "nautilus.io/reservation"
        operator: "Equal"
        value: "erl-ucsd"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090", "NVIDIA-GeForce-RTX-4090", "NVIDIA-A10", "NVIDIA-A40", "NVIDIA-L40", "NVIDIA-L40S", "NVIDIA-RTX-A5000", "NVIDIA-RTX-A6000", "NVIDIA-L4", "NVIDIA-A100-PCIE-40GB", "NVIDIA-A100-80GB-PCIe", "NVIDIA-A100-SXM4-80GB", "Tesla-V100-SXM2-32GB", "NVIDIA-TITAN-RTX", "Quadro-RTX-6000", "Quadro-RTX-8000"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["nrp-01.laccd.edu", "ry-gpu-02.sdsc.optiputer.net"]
      containers:
      - name: main
        image: nvcr.io/nvidia/cuda:11.8.0-cudnn8-devel-ubuntu20.04
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export PYTHONUNBUFFERED=1
          source /data/softsyn_env.sh
          cd /data/soft-synesthesia && git pull --ff-only && git log --oneline -1
          test -f assets/urdf/xarm6/xarm6_allegro_right_fsr_2023_thin_split4.urdf
          mkdir -p /data/logs
          nvidia-smi --query-gpu=name,memory.total --format=csv | tee /data/logs/baseline_gpu.txt
          # GPU memory every 5 min in the background
          (while true; do nvidia-smi --query-gpu=memory.used,utilization.gpu --format=csv,noheader >> /data/logs/baseline_mem.txt; sleep 300; done) &
          python ./isaacgymenvs/train.py headless=True wandb_activate=False \
            task=AllegroArmMOAR task.env.objSet=columns_train task.env.axis=z task.env.sensor=split4 \
            task.env.observationType=partial_stack task.env.ablation_mode=no-pc task.env.legacy_obs=True \
            task.env.numEnvs=8192 \
            train.params.config.minibatch_size=16384 train.params.config.central_value_config.minibatch_size=16384 \
            train.params.config.max_epochs=5000 seed=42 \
            experiment=baseline-binary-split4 train.params.config.user_prefix=binary \
            2>&1 | tee /data/logs/baseline.log
          echo "=== DONE"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: 24Gi
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: 24Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: data
          mountPath: /data
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: data
        persistentVolumeClaim:
          claimName: anderson-softsyn-data
